<!doctype html><html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1512"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Сад"><title>Garden</title>
<style>
:root{--bg:#0f1512;--c:#18211c;--l:#26332b;--t:#e8f0ea;--m:#8fa396;--g:#1fb95b;--b:#2b9be0;--r:#e0485a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px system-ui,sans-serif;padding:env(safe-area-inset-top) 14px 40px}
header{display:flex;align-items:center;gap:10px;padding:14px 0}h1{font-size:20px;margin:0;flex:1}
#dot{width:12px;height:12px;border-radius:50%;background:var(--r)}#dot.on{background:var(--g)}
.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:16px;margin-bottom:12px}
h2{font-size:15px;color:var(--m);margin:0 0 10px;font-weight:600}
.big{font-size:44px;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
button{min-height:48px;border:0;border-radius:12px;background:var(--l);color:var(--t);font-size:16px}
button.on{background:var(--g);color:#fff}button.w{background:var(--b);color:#fff}button.s{background:var(--r);color:#fff}
.room{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--l)}.room:first-of-type{border:0}
.m{color:var(--m);font-size:14px}input{width:100%;margin:4px 0 10px;padding:12px;border-radius:10px;border:1px solid var(--l);background:var(--bg);color:var(--t);font-size:16px}
.hide{display:none}
</style></head><body>
<header><h1>🌿 Сад</h1><span class="m" id="age"></span><div id="dot"></div><button id="gear" style="flex:0;padding:0 14px">⚙️</button></header>

<div id="cfg" class="card hide"><h2>Підключення до MQTT-брокера</h2>
<input id="host" placeholder="xxxx.s1.eu.hivemq.cloud"><input id="port" placeholder="WSS порт (HiveMQ: 8884)">
<input id="user" placeholder="Користувач"><input id="pass" type="password" placeholder="Пароль">
<input id="base" placeholder="garden/controller"><button class="on" id="save" style="width:100%">Зберегти й підключити</button></div>

<div id="app">
<div class="card"><h2>🔥 Опалення</h2><div class="big" id="temp">–</div><div class="m" id="sub"></div>
<div class="row" style="margin:12px 0"><button id="dn">− 0.5</button><button id="sp" disabled>–</button><button id="up">+ 0.5</button></div>
<div class="row"><button data-m="0">Вимк</button><button data-m="1">Ручн</button><button data-m="2">Авто</button></div>
<div class="row" style="margin-top:8px"><button id="vac">🏖 Відпустка</button><button id="rst">До розкладу</button></div></div>

<div class="card"><h2>🏠 Кімнати</h2><div id="rooms" class="m">Немає даних</div></div>
<div class="card"><h2>💡 Освітлення</h2><div class="row" id="lights"></div></div>
<div class="card"><h2>💧 Полив</h2><div class="m" id="wsub" style="margin-bottom:8px"></div>
<div class="row" id="zones"></div><button class="s" id="stop" style="width:100%;margin-top:8px">⏹ Зупинити полив</button></div>
<div class="m" id="fw" style="text-align:center"></div></div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const $=id=>document.getElementById(id);let cl,st=null,last=0,base;
const C=JSON.parse(localStorage.gcfg||'{"port":"8884","base":"garden/controller"}');
for(const k in C)if($(k))$(k).value=C[k];
$('gear').onclick=()=>$('cfg').classList.toggle('hide');
$('save').onclick=()=>{C.host=$('host').value.trim();C.port=$('port').value.trim()||'8884';C.user=$('user').value.trim();C.pass=$('pass').value;C.base=$('base').value.trim().replace(/\/+$/,'')||'garden/controller';localStorage.gcfg=JSON.stringify(C);$('cfg').classList.add('hide');go()};
function pub(t,v){if(cl&&cl.connected)cl.publish(base+'/'+t,String(v),{retain:false});else alert('Немає зв’язку')}
function go(){if(!C.host){$('cfg').classList.remove('hide');return}
 base=C.base;if(cl)cl.end(true);
 cl=mqtt.connect('wss://'+C.host+':'+C.port+'/mqtt',{username:C.user,password:C.pass,reconnectPeriod:3000,connectTimeout:8000});
 cl.on('connect',()=>{$('dot').classList.add('on');cl.subscribe([base+'/state',base+'/availability'])});
 cl.on('close',()=>$('dot').classList.remove('on'));
 cl.on('message',(t,m)=>{m=m.toString();if(t==base+'/state'){try{st=JSON.parse(m);last=Date.now();draw()}catch(e){}}
  else if(t==base+'/availability'&&m=='offline'){$('age').textContent='контролер офлайн'}})}
const f=(v,d=1)=>v==null?'–':(+v).toFixed(d);
function draw(){const s=st;$('temp').textContent=f(s.temperature)+' °C';
 $('sub').textContent='Котел: '+(s.boiler_on?'🔥 ввімкнено':'вимкнено')+(s.outdoor_temperature!=null?' · надворі '+f(s.outdoor_temperature)+' °C':'')+(s.vacation?' · відпустка':'');
 $('sp').textContent='Уставка '+f(s.boiler_setpoint);
 document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',+b.dataset.m==s.boiler_mode));
 $('vac').classList.toggle('on',!!s.vacation);
 $('rooms').innerHTML=(s.xiaomi_sensors||[]).filter(x=>x.enabled).map(x=>`<div class="room"><span>${x.name}${x.online?'':' ⚠️'}</span><b>${f(x.temperature)} °C · ${f(x.humidity,0)}% <span class="m">🔋${x.battery??'–'}%</span></b></div>`).join('')||'Немає даних';
 $('lights').innerHTML=(s.lights||[]).map((o,i)=>`<button class="${o?'on':''}" onclick="pub('light/${i+1}/set','${o?'OFF':'ON'}')">Канал ${i+1}</button>`).join('');
 $('zones').innerHTML=[1,2,3,4].map(z=>`<button class="${s.watering&&s.watering_zone==z?'w':''}" onclick="pub('water/${z}/set','START')">Зона ${z}</button>`).join('');
 $('wsub').textContent=(s.rain?'🌧 іде дощ':s.rain_blocked?'⏳ блокування після дощу':'☀️ сухо')+(s.rain_forecast_mm!=null?' · прогноз '+f(s.rain_forecast_mm)+' мм/6 год':'')+(s.weather_skip?' · автополив пропуститься':'')+(s.watering?' · триває полив':'');
 $('fw').textContent=(s.firmware||'')+' · Wi-Fi '+s.wifi_rssi+' dBm · uptime '+Math.floor((s.uptime_s||0)/3600)+' год'}
setInterval(()=>{if(last)$('age').textContent=Math.round((Date.now()-last)/1000)+' с тому'},1000);
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>pub('boiler/mode/set',b.dataset.m));
$('up').onclick=()=>st&&pub('boiler/setpoint/set',Math.min(30,st.boiler_setpoint+.5));
$('dn').onclick=()=>st&&pub('boiler/setpoint/set',Math.max(5,st.boiler_setpoint-.5));
$('rst').onclick=()=>pub('boiler/setpoint/reset','1');
$('vac').onclick=()=>st&&pub('vacation/set',st.vacation?'OFF':'ON');
$('stop').onclick=()=>pub('water/stop/set','STOP');
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
go();
</script></body></html>
